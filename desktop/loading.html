<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <style>
    html,body{margin:0;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,#0d4057,#061723 62%);color:#edf9fb;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}
    .box{text-align:center}.logo{width:104px;height:104px;border-radius:25px;box-shadow:0 16px 55px rgba(0,188,216,.25)}
    h1{font-size:22px;font-weight:650;margin:20px 0 8px;letter-spacing:.12em}#status{font-size:12px;color:#7eabb7;min-height:20px}.dots:after{content:"";animation:dots 1.4s steps(4,end) infinite}@keyframes dots{25%{content:"."}50%{content:".."}75%{content:"..."}}
  </style>
</head>
<body><div class="box"><img class="logo" src="build/icon.png" alt="鲲鹏智能体"><h1>鲲鹏智能体</h1><div id="status" class="dots">正在启动科研工作台</div></div></body>
</html>
